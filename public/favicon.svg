<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3333" />
      <stop offset="100%" stop-color="#CC0000" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="512" height="512" rx="112" fill="#0A0A0A" />

  <!-- Ultra-clean Geometric 'IK' Monogram -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="36">
    <!-- The 'I' Vertical Stem -->
    <path d="M 144 136 L 144 376" stroke="#FFFFFF" />
    
    <!-- The 'K' Vertical Anchor -->
    <path d="M 232 136 L 232 376" stroke="#FFFFFF" />
    
    <!-- The 'K' Upper Diagonal Wing (tipped with theme red) -->
    <path d="M 336 136 L 232 256" stroke="#FFFFFF" />
    <path d="M 312 184 L 376 136" stroke="url(#redAccent)" stroke-width="32" />

    <!-- The 'K' Lower Diagonal Leg -->
    <path d="M 232 256 L 376 376" stroke="#FFFFFF" />
  </g>

  <!-- Minimalist Red Accent Dot -->
  <circle cx="144" cy="96" r="16" fill="url(#redAccent)" />
</svg>